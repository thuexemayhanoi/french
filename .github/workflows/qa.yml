name: QA
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/factory-prepare.trigger"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run static QA
        run: node scripts/qa.mjs
      - name: Verify generated content index
        run: node tools/build-content-index.mjs --check
      - name: Verify local chatbot HTML index
        run: node tools/build-chat-index.mjs --check
      - name: Check browser scripts
        run: |
          node --check assets/js/assistant.js
          node --check assets/js/components.js
      - name: Verify factory state
        run: node tools/factory.mjs status
