name: Shared Site Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Factory/index commits made with GITHUB_TOKEN do not trigger push workflows.
  workflow_run:
    workflows: [French Article Factory, Local Chat Index, Review Approve]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: shared-pages
  cancel-in-progress: false
jobs:
  changes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.revision.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: revision
        with:
          script: |
            if (context.eventName !== 'workflow_run') return true;
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            return data.commit.sha !== context.payload.workflow_run.head_sha;
  build:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/qa.mjs
      - run: node tools/build-content-index.mjs --check
      - run: node tools/build-chat-index.mjs --check
      - run: node --test tests/shared-site.test.mjs tests/factory-liveness.test.mjs
      - run: node tools/build-site.mjs
      - run: node scripts/qa-shared.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Publish verified shared build
        id: deployment
        uses: actions/deploy-pages@v4
