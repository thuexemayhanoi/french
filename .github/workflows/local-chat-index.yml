name: Local Chat Index
on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - 'tools/build-chat-index.mjs'
      - 'data/chat-index-rebuild.trigger'
permissions:
  contents: write
concurrency:
  group: local-chat-index
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build local HTML search index
        run: node tools/build-chat-index.mjs
      - name: Commit index
        shell: bash
        run: |
          git config user.name "local-chat-index-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add assets/chat/search-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build local chatbot HTML index"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
