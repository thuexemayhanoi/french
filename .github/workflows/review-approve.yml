name: Review Approve

on:
  push:
    branches: [main]
    paths:
      - '_factory/approvals/batch.txt'

permissions:
  contents: write

concurrency:
  group: french-article-factory-v1
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Process approval batch
        shell: bash
        run: |
          set -e
          if [ ! -f "_factory/approvals/batch.txt" ]; then
            echo "No pending batch. Nothing to do."
            exit 0
          fi
          ids="$(grep -E '^FR-[0-9]+$' _factory/approvals/batch.txt | sort -u | tr '\n' ' ')"
          if [ -z "$ids" ]; then
            echo "Batch file present but contains no valid IDs."
            exit 1
          fi
          echo "Approving: [$ids]"
          for id in $ids; do
            echo "=== Approving $id ==="
            node tools/factory.mjs approve "$id"
          done
          rm -f _factory/approvals/batch.txt
          rm -f _factory/approvals/FR-*.txt
          node tools/build-content-index.mjs
          node tools/build-chat-index.mjs
          node scripts/qa.mjs

      - name: Commit factory state
        shell: bash
        run: |
          set -e
          git config user.name "french-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "factory: approve reviewed articles after manual fact-check"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase attempt ${attempt} failed."
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Push attempt ${attempt} failed, retrying after backoff."
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "1" ]; then
            echo "Push failed after 3 attempts."
            exit 1
          fi
