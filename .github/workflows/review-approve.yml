name: Review Approve

on:
  push:
    branches: [main]
    paths:
      - '_factory/approvals/*.txt'

permissions:
  contents: write

concurrency:
  group: french-article-factory-v1
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Collect approval IDs
        id: ids
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.event.sha }}" -- '_factory/approvals/' || true)"
          ids="$(printf '%s\n' "$changed" | sed -n 's#^_factory/approvals/\(FR-[0-9][0-9]*\)\.txt$#\1#p' | sort -u | tr '\n' ' ')"
          ids="$(echo $ids | sed 's/ *$//')"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Collected approval IDs: [$ids]"
          test -n "$ids"

      - name: Approve reviewed articles
        run: |
          for id in ${{ steps.ids.outputs.ids }}; do
            echo "=== Approving $id ==="
            node tools/factory.mjs approve "$id"
          done

      - name: Rebuild indexes and run QA
        run: |
          node tools/build-content-index.mjs
          node tools/build-chat-index.mjs
          node scripts/qa.mjs

      - name: Commit factory state
        shell: bash
        run: |
          set -e
          git config user.name "french-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "factory: approve ${{ steps.ids.outputs.ids }}"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase attempt ${attempt} failed."
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Push attempt ${attempt} failed, retrying after backoff."
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "1" ]; then
            echo "Push failed after 3 attempts."
            exit 1
          fi
