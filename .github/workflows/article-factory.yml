name: French Article Factory

on:
  push:
    branches: [main]
    paths:
      - '_factory/inbox/**'
      - 'data/source-plan.part*.b64'
      - 'data/factory-prepare.trigger'
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Factory control
        required: true
        default: status
        type: choice
        options:
          - prepare-plan
          - refresh-queue
          - process
          - pause
          - resume
          - status
          - approve
      id:
        description: Article ID for approve, e.g. FR-320
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: french-article-factory-v1
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve action
        id: control
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            action="${{ inputs.action }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            action="process"
          else
            changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.event.sha }}" || true)"
            if echo "$changed" | grep -Eq "^(data/source-plan\.part[1-4]\.b64|data/factory-prepare\.trigger)$"; then action="prepare-plan"; else action="process"; fi
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Prepare 500-row plan
        if: steps.control.outputs.action == 'prepare-plan'
        run: |
          node tools/import-plan.mjs
          node tools/factory.mjs refresh-queue
          node tools/build-content-index.mjs
          node tools/build-chat-index.mjs
          node scripts/qa.mjs

      - name: Refresh queue
        if: steps.control.outputs.action == 'refresh-queue'
        run: node tools/factory.mjs refresh-queue

      - name: Pause
        if: steps.control.outputs.action == 'pause'
        run: node tools/factory.mjs pause

      - name: Resume
        if: steps.control.outputs.action == 'resume'
        run: node tools/factory.mjs resume

      - name: Status
        if: steps.control.outputs.action == 'status'
        run: node tools/factory.mjs status

      - name: Detect available writer drafts
        if: steps.control.outputs.action == 'process'
        id: writer_input
        shell: bash
        run: |
          if find _factory/inbox -maxdepth 1 -type f -name '*.article' | grep -q .; then
            echo "has_drafts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_drafts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report writer liveness (read-only)
        if: steps.control.outputs.action == 'process'
        run: node tools/factory-liveness.mjs

      - name: Factory liveness regression tests
        if: steps.control.outputs.action == 'process'
        run: node --test tests/factory-liveness.test.mjs

      - name: Process inbox
        if: steps.control.outputs.action == 'process' && steps.writer_input.outputs.has_drafts == 'true'
        run: |
          node tools/factory.mjs process --before "${{ github.event.before }}" --after "${{ github.event.sha }}"
          node tools/build-content-index.mjs
          node tools/build-chat-index.mjs
          node scripts/qa.mjs
          node tools/factory.mjs verify-last

      - name: Approve reviewed article
        if: steps.control.outputs.action == 'approve'
        run: |
          test -n "${{ inputs.id }}"
          node tools/factory.mjs approve "${{ inputs.id }}"
          node tools/build-content-index.mjs
          node tools/build-chat-index.mjs
          node scripts/qa.mjs

      - name: Commit factory state
        if: steps.control.outputs.action != 'status' && (steps.control.outputs.action != 'process' || steps.writer_input.outputs.has_drafts == 'true')
        shell: bash
        run: |
          set -e
          git config user.name "french-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "factory: ${{ steps.control.outputs.action }}"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase attempt ${attempt} failed."
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Push attempt ${attempt} failed, retrying after backoff."
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "1" ]; then
            echo "Push failed after 3 attempts."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## French Article Factory" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action: ${{ steps.control.outputs.action }}" >> "$GITHUB_STEP_SUMMARY"
          node tools/factory.mjs status >> "$GITHUB_STEP_SUMMARY" || true
