<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body data-page-type="article" data-tags="{{tags}}" data-factory-id="{{id}}" data-parent-path="{{parent_path}}">
<div data-site-header></div>
<main class="shell">
  <div data-breadcrumbs></div>
  <article class="seo-longform">
    <header class="seo-article-head">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{h1}}</h1>
      <p class="lead">{{lead}}</p>
    </header>
    {{content}}
    <div class="context-links">{{required_links}}</div>
  </article>
  <div data-global-cta></div>
  <div data-related></div>
</main>
<div data-site-footer></div>
<script src="/assets/js/site-config.js?v=20261007-nav3"></script>
<script src="/assets/js/silo-map.js"></script>
<script src="/assets/js/content-index.js"></script>
<script src="/assets/js/components.js?v=20261007-toc2"></script>
<script src="/assets/js/app.js"></script>
</body>
</html>
